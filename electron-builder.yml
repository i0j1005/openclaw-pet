appId: ai.openclaw.pet
productName: OpenClaw Pet
directories:
  output: release
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - '!dist/**/*.map'
  - assets/**/*
  - package.json
asar: true
compression: maximum
# Drop the ~55 Chromium locale bundles we do not use (the UI is English with Korean-friendly fonts).
electronLanguages:
  - en
  - ko
mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  icon: assets/icon.png
  # Unsigned by default. Set CSC_LINK / CSC_KEY_PASSWORD (or use the default keychain) to sign.
  identity: null
  extendInfo:
    LSUIElement: true # menu-bar/tray app: no Dock icon
win:
  target:
    - nsis
    - portable
  icon: assets/icon.png
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
